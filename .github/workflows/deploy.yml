name: Build e Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  JAR: target/projetoFase4-0.0.1-SNAPSHOT.jar

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e executar os testes
        run: mvn -B clean package

      - name: Guardar o jar gerado
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ${{ env.JAR }}

  deploy:
    name: Deploy das funções Lambda
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar o jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: artefatos

      - name: Conferir o arquivo
        run: ls -lh artefatos

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Atualizar o código das funções
        run: |
          for funcao in ingestao-avaliacao-java notificacao-urgencia-java relatorio-semanal-java; do
            echo "Atualizando $funcao"
            aws lambda update-function-code \
              --function-name "$funcao" \
              --zip-file fileb://artefatos/projetoFase4-0.0.1-SNAPSHOT.jar \
              --query 'LastModified' --output text
          done